name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## Initial Release" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "First production release of Planning Poker." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Planning Poker v${{ steps.version.outputs.version }}
          body: |
            # Planning Poker v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}

            ## 🚀 Deployment

            This version is automatically deployed to AWS Lightsail.

            **Service URL**: https://${{ vars.DOMAIN_NAME || 'pokerplanning.net' }}

            ## 📋 Build Information

            - **Version**: ${{ steps.version.outputs.version }}
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Go Version**: 1.25
            - **Deployment**: Lightsail instance via AWS Systems Manager

            ## 📚 Documentation

            See [DEPLOY.md](https://github.com/${{ github.repository }}/blob/master/terraform/DEPLOY.md) for deployment guide.
          draft: false
          prerelease: false
          generate_release_notes: false

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Validate Analytics configuration
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          [[ "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]] || { echo "Configure GA_MEASUREMENT_ID before publishing" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
            GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: planning-poker-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through Systems Manager
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          chmod +x scripts/ci-deploy-lightsail.sh
          ./scripts/ci-deploy-lightsail.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.version }}"

      - name: Health check
        env:
          DOMAIN: ${{ vars.DOMAIN_NAME || 'pokerplanning.net' }}
        run: |
          echo "Checking https://${DOMAIN}/monitoring/health"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${DOMAIN}/monitoring/health" | jq -e '.status == "healthy"' >/dev/null; then
              curl -fsS "https://${DOMAIN}/monitoring/health"
              echo
              echo "Deployment successful: https://${DOMAIN}"
              exit 0
            fi
            echo "waiting for healthy (${i})"
            sleep 5
          done
          echo "Health check failed"
          curl -sS "https://${DOMAIN}/monitoring/health" || true
          exit 1
