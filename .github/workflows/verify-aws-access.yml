name: Verify AWS deployment access

on:
  workflow_dispatch:
    inputs:
      redeploy_version:
        description: Optional existing image version to redeploy after the access check
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment script
        if: inputs.redeploy_version != ''
        uses: actions/checkout@v4
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: planning-poker-access-check
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Verify identity and managed node
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          command_id=$(aws ssm send-command \
            --instance-ids "$SSM_INSTANCE_ID" --document-name PlanningPoker-Health \
            --query Command.CommandId --output text)
          for attempt in $(seq 1 40); do
            if ! result=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$SSM_INSTANCE_ID" --output json 2>&1); then
              if [[ "$result" == *InvocationDoesNotExist* ]]; then sleep 3; continue; fi
              printf '%s\n' "$result" >&2
              exit 1
            fi
            status=$(jq -r .Status <<< "$result")
            case "$status" in
              Success) jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) printf '%s\n' "$result" >&2; exit 1 ;;
              Pending|InProgress|Delayed) sleep 3 ;;
              *) printf 'Unexpected status: %s\n' "$status" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for the managed node" >&2
          exit 1

      - name: Redeploy an existing application version
        if: inputs.redeploy_version != ''
        env:
          SSM_INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
          REDEPLOY_VERSION: ${{ inputs.redeploy_version }}
        run: ./scripts/ci-deploy-lightsail.sh "$REDEPLOY_VERSION" "$REDEPLOY_VERSION"
